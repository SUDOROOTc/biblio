<svg xmlns="http://www.w3.org/2000/svg" width="680" height="860" viewBox="0 0 680 860" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Diagramme de cas d'utilisation de la bibliothèque</title>
<desc>Un acteur humain, le bibliothécaire, et un acteur non humain, l'horloge système, reliés à 16 cas d'utilisation regroupés en accès, catalogue, lecteurs, réservations et tableau de bord. Le lecteur n'est pas un acteur.</desc>
<style>
.t{font:400 14px sans-serif;fill:#2C2C2A}
.ts{font:400 12px sans-serif;fill:#5F5E5A}
.th{font:500 14px sans-serif;fill:#2C2C2A}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.teal text{fill:#085041}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.gray text{fill:#444441}
.l{stroke:#5F5E5A;stroke-width:1}
</style>
<rect width="680" height="860" fill="#FFFFFF"/>
<rect x="115" y="40" width="450" height="750" rx="12" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="6 4"/>
<text class="th" x="340" y="64" text-anchor="middle" dominant-baseline="central">Système de gestion de bibliothèque</text>

<line class="l" x1="100" y1="698" x2="190" y2="698"/>
<line class="l" x1="525" y1="116" x2="525" y2="760"/>
<line class="l" x1="470" y1="116" x2="525" y2="116"/>
<line class="l" x1="470" y1="178" x2="525" y2="178"/>
<line class="l" x1="470" y1="214" x2="525" y2="214"/>
<line class="l" x1="470" y1="250" x2="525" y2="250"/>
<line class="l" x1="470" y1="286" x2="525" y2="286"/>
<line class="l" x1="470" y1="348" x2="525" y2="348"/>
<line class="l" x1="470" y1="384" x2="525" y2="384"/>
<line class="l" x1="470" y1="420" x2="525" y2="420"/>
<line class="l" x1="470" y1="456" x2="525" y2="456"/>
<line class="l" x1="470" y1="518" x2="525" y2="518"/>
<line class="l" x1="470" y1="554" x2="525" y2="554"/>
<line class="l" x1="470" y1="590" x2="525" y2="590"/>
<line class="l" x1="470" y1="626" x2="525" y2="626"/>
<line class="l" x1="470" y1="662" x2="525" y2="662"/>
<line class="l" x1="470" y1="760" x2="525" y2="760"/>
<line class="l" x1="525" y1="438" x2="595" y2="438"/>
<text class="ts" x="190" y="92" dominant-baseline="central">Accès (requis avant tous les autres cas)</text>
<text class="ts" x="190" y="154" dominant-baseline="central">Catalogue</text>
<text class="ts" x="190" y="324" dominant-baseline="central">Lecteurs</text>
<text class="ts" x="190" y="494" dominant-baseline="central">Réservations</text>
<text class="ts" x="190" y="736" dominant-baseline="central">Tableau de bord</text>
<g class="teal"><rect x="190" y="102" width="280" height="28" rx="6"/><text class="t" x="330" y="116" text-anchor="middle" dominant-baseline="central">Se connecter</text></g>
<g class="teal"><rect x="190" y="164" width="280" height="28" rx="6"/><text class="t" x="330" y="178" text-anchor="middle" dominant-baseline="central">Créer un livre</text></g>
<g class="teal"><rect x="190" y="200" width="280" height="28" rx="6"/><text class="t" x="330" y="214" text-anchor="middle" dominant-baseline="central">Modifier un livre</text></g>
<g class="teal"><rect x="190" y="236" width="280" height="28" rx="6"/><text class="t" x="330" y="250" text-anchor="middle" dominant-baseline="central">Supprimer un livre</text></g>
<g class="teal"><rect x="190" y="272" width="280" height="28" rx="6"/><text class="t" x="330" y="286" text-anchor="middle" dominant-baseline="central">Lister / rechercher les livres</text></g>
<g class="teal"><rect x="190" y="334" width="280" height="28" rx="6"/><text class="t" x="330" y="348" text-anchor="middle" dominant-baseline="central">Créer un lecteur</text></g>
<g class="teal"><rect x="190" y="370" width="280" height="28" rx="6"/><text class="t" x="330" y="384" text-anchor="middle" dominant-baseline="central">Modifier un lecteur</text></g>
<g class="teal"><rect x="190" y="406" width="280" height="28" rx="6"/><text class="t" x="330" y="420" text-anchor="middle" dominant-baseline="central">Supprimer un lecteur</text></g>
<g class="teal"><rect x="190" y="442" width="280" height="28" rx="6"/><text class="t" x="330" y="456" text-anchor="middle" dominant-baseline="central">Consulter lecteur et réservations</text></g>
<g class="teal"><rect x="190" y="504" width="280" height="28" rx="6"/><text class="t" x="330" y="518" text-anchor="middle" dominant-baseline="central">Réserver un livre</text></g>
<g class="teal"><rect x="190" y="540" width="280" height="28" rx="6"/><text class="t" x="330" y="554" text-anchor="middle" dominant-baseline="central">Annuler une réservation</text></g>
<g class="teal"><rect x="190" y="576" width="280" height="28" rx="6"/><text class="t" x="330" y="590" text-anchor="middle" dominant-baseline="central">Lister les réservations</text></g>
<g class="teal"><rect x="190" y="612" width="280" height="28" rx="6"/><text class="t" x="330" y="626" text-anchor="middle" dominant-baseline="central">Enregistrer l’emprunt</text></g>
<g class="teal"><rect x="190" y="648" width="280" height="28" rx="6"/><text class="t" x="330" y="662" text-anchor="middle" dominant-baseline="central">Enregistrer le retour</text></g>
<g class="gray"><rect x="190" y="684" width="280" height="28" rx="6"/><text class="t" x="330" y="698" text-anchor="middle" dominant-baseline="central">Expirer les réservations (48 h)</text></g>
<g class="teal"><rect x="190" y="746" width="280" height="28" rx="6"/><text class="t" x="330" y="760" text-anchor="middle" dominant-baseline="central">Consulter le tableau de bord</text></g>
<g fill="none" stroke="#2C2C2A" stroke-width="1.2" stroke-linecap="round">
<circle cx="620" cy="410" r="9"/><line x1="620" y1="419" x2="620" y2="446"/><line x1="606" y1="428" x2="634" y2="428"/><line x1="620" y1="446" x2="608" y2="466"/><line x1="620" y1="446" x2="632" y2="466"/>
</g>
<text class="th" x="620" y="484" text-anchor="middle" dominant-baseline="central">Bibliothécaire</text>
<rect x="10" y="674" width="90" height="48" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="55" y="689" text-anchor="middle" dominant-baseline="central">«système»</text>
<text class="th" x="55" y="708" text-anchor="middle" dominant-baseline="central">Horloge</text>

<g class="teal"><rect x="150" y="818" width="14" height="14" rx="3"/></g>
<text class="ts" x="172" y="825" dominant-baseline="central">Déclenché par le bibliothécaire</text>
<g class="gray"><rect x="400" y="818" width="14" height="14" rx="3"/></g>
<text class="ts" x="422" y="825" dominant-baseline="central">Déclenché par l’horloge</text>
</svg>